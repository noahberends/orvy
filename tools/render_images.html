<!doctype html><meta charset="utf-8">
<!-- Renders the PNG icons and the link-preview image from src/site/icon.svg.
     Run tools/dev_server.py, run build.py, open http://localhost:8792/_tools/render_images.html, then call saveAll(). -->
<style>
@font-face{font-family:"Tilt Neon";src:url(/site/fonts/tilt-neon-400.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:400;src:url(/site/fonts/chakra-petch-400.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:600;src:url(/site/fonts/chakra-petch-600.woff2) format("woff2")}
body{margin:0;background:#222}
</style>
<script>
async function iconPNG(size) {
  const svg = await (await fetch("/site/icon.svg")).text();
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  await img.decode();
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(img, 0, 0, size, size);
  return c.toDataURL("image/png");
}
function rr(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
async function ogImage() {
  await document.fonts.load('80px "Tilt Neon"'); await document.fonts.load('600 28px "Chakra Petch"');
  const W = 1200, H = 630, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#0a0614"; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(600, -80, 10, 600, -80, 700); g.addColorStop(0, "rgba(255,43,214,0.16)"); g.addColorStop(1, "rgba(255,43,214,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // A real pattern: two gliders and a blinker, coloured by pitch like the app.
  const cols = 16, rows = 12, cell = 30, ox = 600, oy = 135;
  const lit = [[1,1],[2,2],[0,3],[1,3],[2,3],[9,6],[10,6],[11,6],[9,7],[10,8],[13,2],[13,3],[13,4],[5,8],[6,9],[4,10],[5,10],[6,10]];
  x.fillStyle = "#0b0717"; x.strokeStyle = "rgba(25,240,255,0.3)"; x.lineWidth = 1.5; rr(x, ox - 14, oy - 14, cols * cell + 28, rows * cell + 28, 14); x.fill(); x.stroke();
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    x.fillStyle = `hsla(${325 - ((rows - 1 - r) / (rows - 1)) * 140}, 80%, 65%, 0.22)`;
    x.beginPath(); x.arc(ox + q * cell + cell / 2, oy + r * cell + cell / 2, 1.5, 0, 7); x.fill();
  }
  for (const [q, r] of lit) {
    const h = 325 - ((rows - 1 - r) / (rows - 1)) * 140, X = ox + q * cell + 4, Y = oy + r * cell + 4, s = cell - 8;
    x.save(); x.shadowColor = `hsl(${h} 100% 58%)`; x.shadowBlur = 14;
    rr(x, X, Y, s, s, 7); x.fillStyle = `hsla(${h},100%,55%,0.16)`; x.fill();
    x.lineWidth = 2.2; x.strokeStyle = `hsl(${h} 100% 62%)`; x.stroke(); x.restore();
    x.lineWidth = 0.9; x.strokeStyle = `hsla(${h},100%,92%,0.8)`; rr(x, X, Y, s, s, 7); x.stroke();
  }
  // Playhead
  x.save(); x.shadowColor = "#19f0ff"; x.shadowBlur = 16; x.fillStyle = "rgba(25,240,255,0.12)"; x.fillRect(ox + 5 * cell, oy, cell, rows * cell);
  x.fillStyle = "#19f0ff"; x.fillRect(ox + 6 * cell - 2, oy, 2, rows * cell); x.restore();
  // Name and line
  x.save(); x.font = '110px "Tilt Neon"'; x.fillStyle = "#ffe3fa"; x.shadowColor = "#ff2bd6"; x.shadowBlur = 24; x.fillText("Orvy", 80, 300); x.shadowBlur = 6; x.fillText("Orvy", 80, 300); x.restore();
  x.font = '600 30px "Chakra Petch"'; x.fillStyle = "#d9d1ec";
  x.fillText("A step sequencer driven by", 84, 370); x.fillText("Conway's Game of Life", 84, 410);
  return c.toDataURL("image/png");
}
async function saveAll() {
  const out = {};
  const put = async (name, dataUrl) => {
    const blob = await (await fetch(dataUrl)).blob();
    const res = await fetch("/_save/" + name, { method: "POST", body: blob });
    out[name] = res.ok ? blob.size + " bytes" : "failed " + res.status;
  };
  for (const s of [180, 192, 512]) await put(`icon-${s}.png`, await iconPNG(s));
  await put("og.png", await ogImage());
  return out;
}
</script>
